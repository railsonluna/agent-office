<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #231c18; --panel: #3a2f28; --ink: #f3e9d8; --muted: #b9a993; --ok: #97C459; --warn: #EF9F27; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'Pixelify Sans', system-ui, sans-serif; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  canvas { display: block; border-radius: 14px; box-shadow: 0 0 0 4px var(--panel); }
  #hud { display: flex; gap: 18px; align-items: center; font-size: 16px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  #hud button { font: inherit; color: var(--ink); background: var(--panel); border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  #hud button:hover { background: #4a3d34; }
  #hud button:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  #hud label { display: flex; gap: 8px; align-items: center; }
  #hud select { font: inherit; color: var(--ink); background: var(--panel); border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #hud select:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  [hidden] { display: none !important; }
  #officeCtl { display: flex; gap: 10px; align-items: center; }
  #hud input { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 0; border-radius: 8px; padding: 6px 10px; width: 230px; }
  #hud input::placeholder { color: var(--muted); }
  #hud input:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  #hud button[aria-pressed="true"] { background: #5a4636; color: #FAC775; }
  #ythint { color: var(--warn); font-size: 14px; }
  /* ? o YouTube exige o player visível e com pelo menos 200x200; à esquerda pra não cobrir a vitrola (canto direito da cena) */
  #agentCard { position: fixed; top: 18px; right: 18px; width: 360px; max-width: calc(100vw - 36px); z-index: 20;
    background: #2a221d; color: var(--ink); border-radius: 12px; box-shadow: 0 0 0 3px var(--panel), 0 10px 28px rgba(0,0,0,.55);
    padding: 14px 16px 16px; font-size: 15px; }
  #agentCard header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #agentCard h2 { font-size: 18px; margin: 0; flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  #agentCard .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  #agentCard button { font: inherit; color: var(--ink); background: var(--panel); border: 0; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #agentCard button:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  #agentCard .status { border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: #3a2f28; }
  #agentCard .status.pending { background: #FAC775; color: #2C2C2A; }
  #agentCard .status strong { display: block; margin-bottom: 4px; }
  #agentCard .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  #agentCard dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
  #agentCard dt { color: var(--muted); }
  #agentCard dd { margin: 0; overflow-wrap: anywhere; }
  #agentCard code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #1c1612; border-radius: 6px; padding: 2px 6px; display: inline-block; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
  #tv { position: fixed; left: 18px; bottom: 18px; display: none; padding: 14px 14px 30px; z-index: 10;
    background: linear-gradient(#8B5E3C, #6E4A2F); border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.55); }
  #tv.on { display: block; }
  #tv::before, #tv::after { content: ''; position: absolute; top: -24px; left: 50%; width: 3px; height: 28px; background: #888780; transform-origin: bottom; }
  #tv::before { transform: rotate(-28deg); }
  #tv::after { transform: rotate(28deg); }
  #tv .screen { width: 248px; height: 208px; border: 4px solid #2C2C2A; border-radius: 8px; overflow: hidden; background: #111; }
  #tv .screen iframe { display: block; width: 100%; height: 100%; }
  #tv .knobs { position: absolute; right: 18px; bottom: 8px; display: flex; gap: 6px; }
  #tv .knobs span { width: 12px; height: 12px; border-radius: 50%; background: #D3D1C7; box-shadow: inset -2px -2px 0 #888780; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #E24B4A; margin-right: 7px; }
  .dot.on { background: var(--ok); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" aria-label="Escritório animado mostrando os agentes do Claude Code trabalhando"></canvas>
  <div id="hud">
    <span><span id="dot" class="dot"></span><span id="conn">conectando…</span></span>
    <span id="count">nenhum agente</span>
    <button id="demo">Rodar demo</button>
    <button id="snd">Som ligado</button>
    <label>Cenário <select id="scene"></select></label>
    <span id="officeCtl" hidden>
      <button id="vinylBtn" aria-pressed="false">Vitrola</button>
      <input id="yturl" type="url" placeholder="link do YouTube (lofi)" aria-label="Link do YouTube que a vitrola toca">
      <span id="ythint" role="status"></span>
    </span>
  </div>
</div>
<section id="agentCard" role="dialog" aria-labelledby="acName" hidden>
  <header><span class="swatch" id="acSwatch"></span><h2 id="acName"></h2><button id="acClose" aria-label="Fechar">fechar</button></header>
  <div class="status" id="acStatus"><strong id="acHead"></strong><div class="msg" id="acMsg"></div></div>
  <dl>
    <dt id="acToolLabel">Última ação</dt><dd id="acTool"></dd>
    <dt>Projeto</dt><dd id="acCwd"></dd>
    <dt>Tools</dt><dd id="acTools"></dd>
    <dt>Na sessão há</dt><dd id="acAge"></dd>
  </dl>
</section>
<div id="tv" aria-label="Player da vitrola"><div class="screen"><div id="yt"></div></div><div class="knobs"><span></span><span></span></div></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 1150, H = 650;
function fit() {
  const s = Math.min((innerWidth - 32) / W, (innerHeight - 90) / H), dpr = devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', fit); fit();

const FONT = "'Pixelify Sans', system-ui, sans-serif";
const ST = { shelf: { x: 90, y: 168 }, door: { x: 175, y: 168 }, coffee: { x: 270, y: 168 },
  board: { x: 470, y: 168 }, window: { x: 660, y: 168 }, rack: { x: 860, y: 168 } };
const CORRIDORS = [45, 235, 425, 615, 805, 915];
const PAL = [['#D85A30','#4A1B0C'],['#1D9E75','#04342C'],['#7F77DD','#26215C'],['#BA7517','#412402'],
  ['#D4537E','#4B1528'],['#378ADD','#042C53'],['#639922','#173404'],['#993556','#2C2C2A']];
const SLOTS = [];
for (const [deskY, standY] of [[225, 330], [380, 485]])
  for (const x of [140, 330, 520, 710]) SLOTS.push({ x, deskY, standY, used: null, folders: 0 });
const IDLE_MS = 5 * 60 * 1000, FAILS_TO_DESPAIR = 3;
const isTest = (cmd) => /\b(test|tests|jest|vitest|pytest|mocha|playwright|spec)\b/i.test(cmd || '');

const agents = new Map(), interns = [], parts = [], cards = [];
let built = 0; // ? tools usadas desde que a página abriu (+ as do snapshot): é o que faz o prédio da Obra subir
let T = 0, last = performance.now(), sound = true, actx = null;
const now = () => performance.now();
const base = (p) => (p || '').split(/[\\/]/).filter(Boolean).pop() || '';
const short = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

// ---------- agentes ----------
function makeAgent(id, cwd, init = {}) {
  const slot = SLOTS.find((s) => !s.used);
  if (!slot) return null;
  const idx = SLOTS.indexOf(slot);
  let name = base(cwd) || 'claude';
  const same = [...agents.values()].filter((a) => a.baseName === name).length;
  const a = { id, baseName: name, name: same ? `${name} #${same + 1}` : name, slot, ci: idx,
    c: PAL[idx][0], h: PAL[idx][1], x: ST.door.x, y: ST.door.y, path: [], queue: [], cur: null,
    bubble: '', alert: '', hand: false, screen: false, mug: false, alpha: 1,
    last: init.last ? now() - (Date.now() - init.last) : now(),
    born: init.first || Date.now(), tools: init.tools || 0, testFails: 0, despair: false,
    leaving: false, blink: Math.random() * 3, intern: [], cwd: cwd || '', lastTool: null, alertFull: '', alertAt: 0 };
  slot.folders = 0;
  slot.used = a; agents.set(id, a);
  built += init.tools || 0;
  goTo(a, home(a)); updateCount();
  return a;
}
const home = (a) => ({ x: a.slot.x, y: a.slot.standY });
const nearest = (arr, v) => arr.reduce((b, c) => (Math.abs(c - v) < Math.abs(b - v) ? c : b));
function route(p, t) {
  const pr = p.y > 200, tr = t.y > 200;
  if (pr && tr && Math.abs(p.y - t.y) < 5) return [t];
  if (!pr && !tr) return [t];
  const c = nearest(CORRIDORS, pr && !tr ? p.x : t.x);
  const pts = [];
  if (pr) pts.push({ x: c, y: p.y }); else pts.push({ x: c, y: 172 });
  pts.push({ x: c, y: tr ? t.y : 172 });
  pts.push(t);
  return pts;
}
function goTo(a, t) { a.path = route(a, t); }
function push(a, act) {
  a.queue.push(act);
  if (a.queue.length > 4) a.queue.splice(0, a.queue.length - 3);
}
function startAct(a, act) {
  a.cur = act; act.started = 0; a.bubble = ''; a.screen = false; a.mug = false;
  const off = ((SLOTS.indexOf(a.slot) % 4) - 1.5) * 46;
  const t = act.to === 'desk' ? home(a) : { x: ST[act.to].x + off, y: ST[act.to].y };
  if (Math.hypot(t.x - a.x, t.y - a.y) > 2) goTo(a, t);
}
function leave(a) {
  a.leaving = true; a.queue = []; a.cur = null; a.bubble = 'até mais!'; a.hand = false;
  if (a.rest) { a.rest.spot.used = null; a.rest = null; a.mug = false; }
  goTo(a, ST.door);
  interns.filter((i) => i.parent === a).forEach((i) => { i.delivering = false; i.carry = false; i.leaving = true; i.path = route(i, ST.door); });
}

// ---------- subagentes (estagiários) ----------
function spawnIntern(a, label) {
  const i = { parent: a, ci: a.ci, x: ST.door.x, y: ST.door.y, path: [], c: a.c, h: a.h, label: short(label || 'subagente', 14),
    next: 0, alpha: 1, leaving: false, blink: 1 };
  interns.push(i); a.intern.push(i);
}
// ? terminou: leva a pastinha até a mesa do agente principal e só depois sai pela porta
function dropIntern(a) {
  const i = a.intern.shift();
  if (i) { i.delivering = true; i.carry = true; i.leaveAt = 0; i.path = route(i, { x: a.slot.x + 62, y: a.slot.standY }); }
}
function deliverFolder(i) {
  const s = i.parent.slot;
  i.carry = false; s.folders = Math.min(3, s.folders + 1);
  burst(s.x + 41, s.deskY + 34, 10, ['#97C459', '#C0DD97']);
}

// ---------- pet (office: Lucky, o lhasa apso; halloween: fantasma) ----------
// ? anda pelo escritório; às vezes deita na mesa de quem está sem eventos há mais de IDLE_MS
const pet = { x: 560, y: 515, path: [], mode: 'walk', next: 0, dir: 1, target: null, slot: null, jump: null, blink: 2 };
const LANES = [172, 342, 515];
const isIdle = (a) => !a.leaving && now() - a.last > IDLE_MS;
const deskSpot = (s) => ({ x: s.x - 40, y: s.deskY + 44 });
const floorSpot = (s) => ({ x: s.x - 40, y: s.standY - 6 });
function petJump(to, then) { pet.jump = { fx: pet.x, fy: pet.y, tx: to.x, ty: to.y, t: 0, then }; pet.mode = 'jump'; }
function stepPet(dt) {
  if (pet.mode === 'jump') {
    const j = pet.jump; j.t = Math.min(1, j.t + dt * 2);
    pet.x = j.fx + (j.tx - j.fx) * j.t; pet.y = j.fy + (j.ty - j.fy) * j.t - Math.sin(j.t * Math.PI) * 30;
    if (j.t >= 1) { pet.mode = j.then; pet.jump = null; }
    return;
  }
  const player = fetchPlayer();
  if (player) { stepFetch(dt, player); return; }
  if (pet.mode === 'fetch') { pet.mode = 'walk'; pet.fetch = null; pet.ball = null; pet.path = []; pet.next = 0; }
  if (pet.mode === 'desk') {
    const a = pet.slot.used;
    if (!a || !isIdle(a)) { const s = pet.slot; pet.slot = null; petJump(floorSpot(s), 'walk'); pet.next = now() + 1500; }
    return;
  }
  const from = pet.x; move(pet, dt, 70);
  if (pet.x !== from) pet.dir = Math.sign(pet.x - from);
  if (pet.path.length || now() < pet.next) return;
  if (pet.target) {
    const s = pet.target; pet.target = null;
    if (s.used && isIdle(s.used)) { pet.slot = s; petJump(deskSpot(s), 'desk'); return; }
  }
  const sleepy = SLOTS.filter((s) => s.used && isIdle(s.used));
  if (sleepy.length && Math.random() < .4) {
    pet.target = sleepy[(Math.random() * sleepy.length) | 0]; pet.path = route(pet, floorSpot(pet.target));
  } else {
    pet.path = route(pet, { x: 40 + Math.random() * 900, y: LANES[(Math.random() * LANES.length) | 0] });
    pet.next = now() + 2000 + Math.random() * 4000;
  }
}
function petZ(dx, dy, color) {
  ctx.globalAlpha = .5 + Math.sin(T * 2) * .4; ctx.font = `12px ${FONT}`; ctx.fillStyle = color;
  ctx.fillText('z', pet.x + dx, pet.y + dy - (T * 6 % 10)); ctx.globalAlpha = 1;
}
// ? Lucky, o lhasa apso: pelo longo dourado arrastando no chão, franja nos olhos e o rabo em pluma por cima das costas
function drawDog() {
  const lying = pet.mode === 'desk', mv = pet.path.length > 0 && pet.mode === 'walk';
  const fur = '#E8C88A', light = '#F6E3B4', ear = '#B98A4A', wag = Math.sin(T * (mv ? 10 : 4)) * 2;
  ctx.save(); ctx.translate(pet.x, pet.y); ctx.scale(pet.dir < 0 ? -1 : 1, 1);
  if (lying) {
    ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, -6, 15, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(-8, -11, 7, 4, -.4, 0, 7); ctx.fill();
    ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(13, -7, 7, 5.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = ear; ctx.beginPath(); ctx.ellipse(9, -4, 3, 5, .3, 0, 7); ctx.fill();
    ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(14, -10, 6, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2C2C2A'; ctx.fillRect(13, -8, 3, 1); ctx.beginPath(); ctx.arc(20, -6, 1.6, 0, 7); ctx.fill();
    ctx.restore(); petZ(18, -20, '#378ADD');
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, 0, 15, 3, 0, 0, 7); ctx.fill();
  const lp = mv ? Math.sin(T * 16) * 1.5 : 0;
  ctx.fillStyle = ear; ctx.fillRect(-9, -4, 3, 4 + lp); ctx.fillRect(6, -4, 3, 4 - lp);
  // corpo com a saia de pelo ondulada
  ctx.fillStyle = fur; ctx.beginPath(); ctx.moveTo(-14, -12);
  ctx.quadraticCurveTo(0, -20, 12, -13);
  ctx.lineTo(13, -3);
  for (let x = 13; x >= -15; x -= 4) ctx.lineTo(x, -1 - ((x / 4 + T * (mv ? 8 : 2)) % 2 > 1 ? 1.5 : 0));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#D9B26E'; ctx.lineWidth = 1;
  for (const x of [-9, -3, 3, 8]) { ctx.beginPath(); ctx.moveTo(x, -11); ctx.lineTo(x - 1, -3); ctx.stroke(); }
  // rabo em pluma curvado por cima das costas
  ctx.strokeStyle = light; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(-12, -13); ctx.quadraticCurveTo(-18 + wag, -24, -6 + wag, -22); ctx.stroke(); ctx.lineCap = 'butt';
  // cabeça, orelhas compridas, franja, focinho
  ctx.fillStyle = fur; ctx.beginPath(); ctx.arc(14, -17, 7, 0, 7); ctx.fill();
  ctx.fillStyle = ear; ctx.beginPath(); ctx.ellipse(9.5, -11, 3.2, 7, .15, 0, 7); ctx.fill();
  ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(15, -21, 7, 3.2, 0, 0, 7); ctx.fill();
  pet.blink -= 1 / 60; if (pet.blink < 0) pet.blink = 2 + Math.random() * 4;
  ctx.fillStyle = '#2C2C2A'; ctx.fillRect(14, -18, 2, pet.blink < .12 ? 1 : 2);
  ctx.fillStyle = light; ctx.beginPath(); ctx.ellipse(19, -13, 4, 3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2C2C2A'; ctx.beginPath(); ctx.arc(21.5, -15, 1.8, 0, 7); ctx.fill();
  // coleira com plaquinha
  ctx.fillStyle = '#E24B4A'; ctx.fillRect(10, -11.5, 7, 2.2);
  ctx.fillStyle = '#FAC775'; ctx.beginPath(); ctx.arc(14, -8.5, 1.6, 0, 7); ctx.fill();
  ctx.restore();
  ctx.font = `11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = SCENE.ink; ctx.fillText('Lucky', pet.x, pet.y + 12); ctx.textAlign = 'left';
}
// ? fantasma: flutua (nunca encosta no chão), a sombra encolhe quando ele sobe; na mesa, cochila pairando
function drawGhost() {
  const sleeping = pet.mode === 'desk', mv = pet.path.length > 0;
  const hover = sleeping ? 4 : 10 + Math.sin(T * 2.2) * 3;
  ctx.save(); ctx.translate(pet.x, pet.y);
  if (!sleeping) {
    ctx.fillStyle = `rgba(0,0,0,${.22 - hover * .008})`; ctx.beginPath(); ctx.ellipse(0, 0, 11 - hover * .2, 2.5, 0, 0, 7); ctx.fill();
  }
  ctx.translate(0, -hover); ctx.scale(pet.dir < 0 ? -1 : 1, 1);
  const tilt = mv ? .12 : 0; ctx.rotate(tilt);
  const gl = ctx.createRadialGradient(0, -14, 2, 0, -14, 26);
  gl.addColorStop(0, 'rgba(214,200,240,.35)'); gl.addColorStop(1, 'rgba(214,200,240,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(0, -14, 26, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(248,244,255,.92)'; ctx.beginPath();
  ctx.arc(0, -18, 11, Math.PI, 0); ctx.lineTo(11, -2);
  for (let k = 0; k < 4; k++) { const x0 = 11 - k * 5.5; ctx.quadraticCurveTo(x0 - 2.75, 2 + Math.sin(T * 6 + k) * 2, x0 - 5.5, -2); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2C2C2A';
  if (sleeping) { ctx.fillRect(-5, -18, 4, 1.2); ctx.fillRect(3, -18, 4, 1.2); }
  else {
    ctx.beginPath(); ctx.ellipse(-3, -18, 1.8, 2.6, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(4, -18, 1.8, 2.6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(.5, -12, 1.6, 2, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
  if (sleeping) petZ(14, -24, '#B48CF0');
}

// ---------- área de descanso (só no office) ----------
// ? quem termina e fica BREAK_MS sem evento vai pro bar, pro fliperama ou brincar com o Lucky; qualquer evento traz de volta
const BREAK_MS = 2 * 60 * 1000;
const LOUNGE = [
  { kind: 'bar', x: 75, y: 640 }, { kind: 'bar', x: 135, y: 640 }, { kind: 'bar', x: 195, y: 640 },
  { kind: 'arcade', x: 462, y: 640 }, { kind: 'arcade', x: 562, y: 640 },
  { kind: 'fetch', x: 760, y: 640 },
].map((s) => ({ ...s, used: null }));
const REST_SAY = { bar: 'happy hour!', arcade: 'só mais uma partida', fetch: 'pega, Lucky!' };
const ARCADES = [430, 530];
function startRest(a) {
  const free = (SCENE.lounge || []).filter((s) => !s.used);
  if (!free.length) return;
  const s = free[(Math.random() * free.length) | 0];
  s.used = a; a.rest = { kind: s.kind, spot: s, sayUntil: 0 }; a.bubble = '';
  goTo(a, s);
}
function endRest(a) {
  if (!a.rest) return;
  a.rest.spot.used = null; a.rest = null; a.mug = false;
  goTo(a, home(a));
}
const fetchPlayer = () => (isOffice() ? [...agents.values()].find((a) => a.rest && a.rest.kind === 'fetch' && !a.path.length && !a.leaving) : null);
function stepFetch(dt, p) {
  const side = { x: p.x + 30, y: p.y + 2 };
  if (pet.mode === 'desk') { const s = pet.slot; pet.slot = null; petJump(floorSpot(s), 'walk'); return; }
  if (pet.mode !== 'fetch') { pet.mode = 'fetch'; pet.target = null; pet.fetch = { phase: 'come', at: 0, throwUntil: 0 }; pet.ball = null; pet.path = route(pet, side); }
  const F = pet.fetch, b = pet.ball;
  const from = pet.x; move(pet, dt, 150);
  if (pet.x !== from) pet.dir = Math.sign(pet.x - from);
  if (b && b.flying) {
    b.t = Math.min(1, b.t + dt / .9);
    b.x = b.fx + (b.tx - b.fx) * b.t; b.y = b.fy + (b.ty - b.fy) * b.t - Math.sin(b.t * Math.PI) * 70;
    if (b.t >= 1) b.flying = false;
  }
